services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: alofood
      POSTGRES_USER: alofood
      POSTGRES_PASSWORD: alofood
    ports:
      - "5432:5432"
    volumes:
      - alofood_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alofood -d alofood"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  alofood_postgres:
