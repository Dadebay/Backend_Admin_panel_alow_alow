name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24.18.0
  NPM_VERSION: 11.6.2
  VITE_MAP_TILE_URL: ${{ vars.VITE_MAP_TILE_URL || '/tile/{z}/{x}/{y}.png' }}
  VITE_MAP_ATTRIBUTION: ${{ vars.VITE_MAP_ATTRIBUTION || '© OpenStreetMap contributors' }}

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: alowalow-ci-${{ github.run_id }}-${{ github.run_attempt }}
      MINIO_IMAGE: alowalow-ci-minio:release-20250907
      MINIO_MC_IMAGE: alowalow-ci-mc:release-20250813
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
          package-manager-cache: true

      - name: Pin npm
        run: npm install --global "npm@${NPM_VERSION}" --no-audit --no-fund

      - name: Install API dependencies
        run: npm ci --prefix apps/api --no-audit --no-fund

      - name: Load pinned isolated MinIO images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ci-test-services-20260928 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern minio-test-services-amd64.tar.gz \
            --dir "$RUNNER_TEMP"
          printf '%s  %s\n' \
            02c5822eb3f2c250edacd74baa12a66d001c5c2029ecb67ff2e469c63ff8d929 \
            "$RUNNER_TEMP/minio-test-services-amd64.tar.gz" | sha256sum --check -
          docker load --input "$RUNNER_TEMP/minio-test-services-amd64.tar.gz"
          test "$(docker image inspect "$MINIO_IMAGE" --format '{{.Id}}')" = \
            sha256:69b2ec208575b69597784255eec6fa6a2985ee9e1a47f4411a51f7f5fdd193a9
          test "$(docker image inspect "$MINIO_MC_IMAGE" --format '{{.Id}}')" = \
            sha256:c2ad77420d33bb4ad8694457d3edf7188076428582bd24e3dd4d09d6a1d52872

      - name: Start isolated test services
        run: |
          docker compose up -d --wait postgres redis minio
          docker compose run --rm minio-init

      - name: Lint API
        run: npm --prefix apps/api run lint

      - name: Build API
        run: npm --prefix apps/api run build

      - name: Test API with coverage
        run: npm --prefix apps/api test

      - name: Audit all API dependencies
        run: npm --prefix apps/api audit --audit-level=low

      - name: Audit production API dependencies
        run: npm --prefix apps/api audit --omit=dev --audit-level=low

      - name: Upload coverage report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-coverage-${{ github.run_id }}
          path: apps/api/coverage
          if-no-files-found: warn
          retention-days: 14

      - name: Stop isolated test services
        if: always()
        run: docker compose down --volumes --remove-orphans

  frontend:
    name: Admin quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
          package-manager-cache: true

      - name: Pin npm
        run: npm install --global "npm@${NPM_VERSION}" --no-audit --no-fund

      - name: Install admin dependencies
        run: npm ci --prefix apps/admin --no-audit --no-fund

      - name: Lint admin
        run: npm --prefix apps/admin run lint

      - name: Build and test admin
        run: npm --prefix apps/admin test

      - name: Audit all admin dependencies
        run: npm --prefix apps/admin audit --audit-level=low

      - name: Audit production admin dependencies
        run: npm --prefix apps/admin audit --omit=dev --audit-level=low

      - name: Upload deployable admin build
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alowalow-admin-${{ github.ref_name }}-${{ github.sha }}
          path: apps/admin/dist/client
          if-no-files-found: error
          retention-days: 14

  print_agent:
    name: Receipt print agent
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/print-agent/go.mod
          cache: false

      - name: Verify formatting, tests, and static analysis
        run: |
          test -z "$(gofmt -l .)"
          go test ./...
          go vet ./...
        working-directory: apps/print-agent

      - name: Build Windows and macOS executables
        env:
          VERSION: ${{ github.sha }}
        run: ./build-release.sh
        working-directory: apps/print-agent

      - name: Upload print agent executables
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: a7-tagam-print-agent-${{ github.sha }}
          path: apps/print-agent/dist/
          if-no-files-found: error
          retention-days: 30

  api_contract:
    name: Swagger contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/api/package-lock.json
          package-manager-cache: true

      - name: Pin npm
        run: npm install --global "npm@${NPM_VERSION}" --no-audit --no-fund

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix apps/api --no-audit --no-fund

      - name: Regenerate Swagger TypeScript contract
        run: npm run api:client

      - name: Verify generated files are committed
        run: git diff --exit-code -- apps/api/openapi.json packages/api-contract/src/schema.ts

  container:
    name: Runtime containers
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build runtime image
        run: docker build --file apps/api/Dockerfile --target runtime --tag alowalow-api:ci apps/api

      - name: Build migration image
        run: docker build --file apps/api/Dockerfile --target migration --tag alowalow-migration:ci apps/api

      - name: Build static admin image
        run: |
          docker build \
            --file apps/admin/Dockerfile \
            --build-arg "VITE_MAP_TILE_URL=${VITE_MAP_TILE_URL}" \
            --build-arg "VITE_MAP_ATTRIBUTION=${VITE_MAP_ATTRIBUTION}" \
            --tag alowalow-admin:ci \
            .

      - name: Verify hardened runtime metadata
        run: |
          test "$(docker image inspect alowalow-api:ci --format '{{.Config.User}}')" = "node"
          test -n "$(docker image inspect alowalow-api:ci --format '{{json .Config.Healthcheck}}')"
          test "$(docker image inspect alowalow-admin:ci --format '{{.Config.User}}')" = "101"
          test -n "$(docker image inspect alowalow-admin:ci --format '{{json .Config.Healthcheck}}')"

      - name: Validate production Compose
        run: |
          ALOWALOW_API_IMAGE=alowalow-api:ci \
          ALOWALOW_MIGRATION_IMAGE=alowalow-migration:ci \
          ALOWALOW_ADMIN_IMAGE=alowalow-admin:ci \
          ALOWALOW_COMPOSE_PROJECT=alowalow-production \
          ALOWALOW_ENV_FILE=production.env.example \
          ALOWALOW_COMPOSE_OVERRIDE=compose.single-host.yml \
          ALOWALOW_API_PORT=4000 \
          ALOWALOW_ADMIN_PORT=3000 \
            docker compose \
              --file deploy/compose.production.yml \
              --file deploy/compose.single-host.yml \
              config --quiet

  publish_images:
    name: Publish runtime images
    needs:
      - backend
      - frontend
      - api_contract
      - container
      - print_agent
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    outputs:
      api_image: ${{ steps.names.outputs.api_image }}
      migration_image: ${{ steps.names.outputs.migration_image }}
      admin_image: ${{ steps.names.outputs.admin_image }}
      api_digest: ${{ steps.publish.outputs.api_digest }}
      migration_digest: ${{ steps.publish.outputs.migration_digest }}
      admin_digest: ${{ steps.publish.outputs.admin_digest }}
      deployment_channel: ${{ steps.names.outputs.deployment_channel }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Resolve immutable image names
        id: names
        shell: bash
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          test "$GITHUB_REF" = "refs/heads/main"
          deployment_channel="production"
          echo "api_image=${repository}-api" >> "$GITHUB_OUTPUT"
          echo "migration_image=${repository}-migration" >> "$GITHUB_OUTPUT"
          echo "admin_image=${repository}-admin" >> "$GITHUB_OUTPUT"
          echo "deployment_channel=${deployment_channel}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Initialize BuildKit
        run: |
          docker buildx create --name alowalow-builder --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Build and publish provenance-enabled images
        id: publish
        env:
          API_IMAGE: ${{ steps.names.outputs.api_image }}
          MIGRATION_IMAGE: ${{ steps.names.outputs.migration_image }}
          ADMIN_IMAGE: ${{ steps.names.outputs.admin_image }}
          DEPLOYMENT_CHANNEL: ${{ steps.names.outputs.deployment_channel }}
        run: |
          api_tags=(
            --tag "${API_IMAGE}:sha-${GITHUB_SHA}"
            --tag "${API_IMAGE}:${DEPLOYMENT_CHANNEL}"
          )
          migration_tags=(
            --tag "${MIGRATION_IMAGE}:sha-${GITHUB_SHA}"
            --tag "${MIGRATION_IMAGE}:${DEPLOYMENT_CHANNEL}"
          )
          admin_tags=(
            --tag "${ADMIN_IMAGE}:sha-${GITHUB_SHA}"
            --tag "${ADMIN_IMAGE}:${DEPLOYMENT_CHANNEL}"
          )
          docker buildx build \
            --file apps/api/Dockerfile \
            --target runtime \
            --platform linux/amd64 \
            --provenance=mode=max \
            --sbom=true \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            "${api_tags[@]}" \
            --metadata-file /tmp/api-metadata.json \
            --push \
            apps/api
          docker buildx build \
            --file apps/api/Dockerfile \
            --target migration \
            --platform linux/amd64 \
            --provenance=mode=max \
            --sbom=true \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            "${migration_tags[@]}" \
            --metadata-file /tmp/migration-metadata.json \
            --push \
            apps/api
          docker buildx build \
            --file apps/admin/Dockerfile \
            --platform linux/amd64 \
            --provenance=mode=max \
            --sbom=true \
            --build-arg "VITE_MAP_TILE_URL=${VITE_MAP_TILE_URL}" \
            --build-arg "VITE_MAP_ATTRIBUTION=${VITE_MAP_ATTRIBUTION}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            "${admin_tags[@]}" \
            --metadata-file /tmp/admin-metadata.json \
            --push \
            .
          echo "api_digest=$(jq -r '."containerimage.digest"' /tmp/api-metadata.json)" >> "$GITHUB_OUTPUT"
          echo "migration_digest=$(jq -r '."containerimage.digest"' /tmp/migration-metadata.json)" >> "$GITHUB_OUTPUT"
          echo "admin_digest=$(jq -r '."containerimage.digest"' /tmp/admin-metadata.json)" >> "$GITHUB_OUTPUT"

      - name: Log out of registry
        if: always()
        run: docker logout ghcr.io

  deploy_production:
    name: Deploy production stack
    needs:
      - publish_images
    if: >-
      needs.publish_images.result == 'success'
      && needs.publish_images.outputs.deployment_channel == 'production'
      && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure verified SSH access
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Prepare immutable release references
        env:
          API_IMAGE: ${{ needs.publish_images.outputs.api_image }}
          API_DIGEST: ${{ needs.publish_images.outputs.api_digest }}
          MIGRATION_IMAGE: ${{ needs.publish_images.outputs.migration_image }}
          MIGRATION_DIGEST: ${{ needs.publish_images.outputs.migration_digest }}
          ADMIN_IMAGE: ${{ needs.publish_images.outputs.admin_image }}
          ADMIN_DIGEST: ${{ needs.publish_images.outputs.admin_digest }}
          POSTGRES_IMAGE: nexus.telecom.tm/postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
          REDIS_IMAGE: nexus.telecom.tm/redis:8.8.0-alpine@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
          MINIO_IMAGE: nexus.telecom.tm/minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
          MINIO_MC_IMAGE: nexus.telecom.tm/minio/mc:latest@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
          TILESERVER_IMAGE: nexus.telecom.tm/maptiler/tileserver-gl:v5.6.0@sha256:3a9ccdb24820b6814c8119bcc8a4376c39867cb0ffe69d62919ef898b90c2427
          GEOCODING_IMAGE: nexus.telecom.tm/mediagis/nominatim:5.3@sha256:7923a8e67197fc6d4f4ecb7c0e8bbedffeddcfdf4519596fe946e46a28f5a9f8
          API_PORT: ${{ vars.API_PORT || '4000' }}
          ADMIN_PORT: ${{ vars.ADMIN_PORT || '3000' }}
        run: |
          case "$API_PORT" in
            ''|*[!0-9]*) echo "API_PORT must be numeric" >&2; exit 1 ;;
          esac
          case "$ADMIN_PORT" in
            ''|*[!0-9]*) echo "ADMIN_PORT must be numeric" >&2; exit 1 ;;
          esac
          if [ "$API_PORT" -lt 1 ] || [ "$API_PORT" -gt 65535 ]; then
            echo "API_PORT must be between 1 and 65535" >&2
            exit 1
          fi
          if [ "$ADMIN_PORT" -lt 1 ] || [ "$ADMIN_PORT" -gt 65535 ]; then
            echo "ADMIN_PORT must be between 1 and 65535" >&2
            exit 1
          fi
          if [ "$API_PORT" = "$ADMIN_PORT" ]; then
            echo "API_PORT and ADMIN_PORT must be different" >&2
            exit 1
          fi
          printf 'ALOWALOW_API_IMAGE=%s@%s\n' "$API_IMAGE" "$API_DIGEST" > /tmp/alowalow-release.env
          printf 'ALOWALOW_MIGRATION_IMAGE=%s@%s\n' "$MIGRATION_IMAGE" "$MIGRATION_DIGEST" >> /tmp/alowalow-release.env
          printf 'ALOWALOW_ADMIN_IMAGE=%s@%s\n' "$ADMIN_IMAGE" "$ADMIN_DIGEST" >> /tmp/alowalow-release.env
          printf 'ALOWALOW_POSTGRES_IMAGE=%s\n' "$POSTGRES_IMAGE" >> /tmp/alowalow-release.env
          printf 'ALOWALOW_REDIS_IMAGE=%s\n' "$REDIS_IMAGE" >> /tmp/alowalow-release.env
          printf 'ALOWALOW_MINIO_IMAGE=%s\n' "$MINIO_IMAGE" >> /tmp/alowalow-release.env
          printf 'ALOWALOW_MINIO_MC_IMAGE=%s\n' "$MINIO_MC_IMAGE" >> /tmp/alowalow-release.env
          printf 'ALOWALOW_TILESERVER_IMAGE=%s\n' "$TILESERVER_IMAGE" >> /tmp/alowalow-release.env
          printf 'ALOWALOW_GEOCODING_IMAGE=%s\n' "$GEOCODING_IMAGE" >> /tmp/alowalow-release.env
          printf 'ALOWALOW_COMPOSE_PROJECT=alowalow-production\n' >> /tmp/alowalow-release.env
          printf 'ALOWALOW_ENV_FILE=.env.production\n' >> /tmp/alowalow-release.env
          printf 'ALOWALOW_COMPOSE_OVERRIDE=docker-compose.single-host.yml\n' >> /tmp/alowalow-release.env
          printf 'ALOWALOW_API_PORT=%s\n' "$API_PORT" >> /tmp/alowalow-release.env
          printf 'ALOWALOW_ADMIN_PORT=%s\n' "$ADMIN_PORT" >> /tmp/alowalow-release.env

      - name: Deploy after successful migration
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST_OTP_PHONES: ${{ secrets.LONG_LIVED_TEST_OTP_PHONES }}
          TEST_OTP_CODE: ${{ secrets.LONG_LIVED_TEST_OTP_CODE }}
          TEST_OTP_EXPIRES_AT: ${{ secrets.LONG_LIVED_TEST_OTP_EXPIRES_AT }}
          RECEIPT_AGENT_API_TOKEN: ${{ secrets.RECEIPT_AGENT_API_TOKEN }}
        run: |
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$GHCR_TOKEN"
          test -n "$RECEIPT_AGENT_API_TOKEN"
          case "$SSH_PORT" in
            ''|*[!0-9]*) echo "SSH_PORT must be numeric" >&2; exit 1 ;;
          esac
          if [ "$SSH_PORT" -lt 1 ] || [ "$SSH_PORT" -gt 65535 ]; then
            echo "SSH_PORT must be between 1 and 65535" >&2
            exit 1
          fi
          case "$GITHUB_ACTOR" in
            ''|*[!A-Za-z0-9_-]*) echo "Unsafe GitHub actor" >&2; exit 1 ;;
          esac
          ssh_command=(ssh -p "$SSH_PORT" -o ConnectTimeout=30 -o ConnectionAttempts=2)
          scp_command=(scp -P "$SSH_PORT" -o ConnectTimeout=30 -o ConnectionAttempts=2)
          cleanup_registry_login() {
            "${ssh_command[@]}" "${SSH_USER}@${SSH_HOST}" \
              'docker logout ghcr.io >/dev/null 2>&1 || true'
          }
          runtime_secret_file=/tmp/alowalow-test-otp.env
          receipt_agent_secret_file=/tmp/alowalow-receipt-agent.env
          cleanup() {
            rm -f "$runtime_secret_file" "$receipt_agent_secret_file"
            cleanup_registry_login
          }
          trap cleanup EXIT
          if [ -n "$TEST_OTP_PHONES" ] || [ -n "$TEST_OTP_CODE" ] || [ -n "$TEST_OTP_EXPIRES_AT" ]; then
            test -n "$TEST_OTP_PHONES"
            test -n "$TEST_OTP_CODE"
            test -n "$TEST_OTP_EXPIRES_AT"
            umask 077
            {
              printf 'LONG_LIVED_TEST_OTP_PHONES=%s\n' "$TEST_OTP_PHONES"
              printf 'LONG_LIVED_TEST_OTP_CODE=%s\n' "$TEST_OTP_CODE"
              printf 'LONG_LIVED_TEST_OTP_EXPIRES_AT=%s\n' "$TEST_OTP_EXPIRES_AT"
            } > "$runtime_secret_file"
          fi
          umask 077
          printf 'RECEIPT_AGENT_API_TOKEN=%s\n' "$RECEIPT_AGENT_API_TOKEN" > "$receipt_agent_secret_file"
          printf '%s' "$GHCR_TOKEN" \
            | "${ssh_command[@]}" "${SSH_USER}@${SSH_HOST}" \
              "docker login ghcr.io --username '$GITHUB_ACTOR' --password-stdin"
          "${ssh_command[@]}" "${SSH_USER}@${SSH_HOST}" \
            'sudo install -d -m 750 -o "$USER" -g "$USER" /opt/alowalow/production'
          "${scp_command[@]}" deploy/compose.production.yml \
            "${SSH_USER}@${SSH_HOST}:/opt/alowalow/production/docker-compose.production.yml"
          "${scp_command[@]}" deploy/compose.single-host.yml \
            "${SSH_USER}@${SSH_HOST}:/opt/alowalow/production/docker-compose.single-host.yml"
          "${scp_command[@]}" deploy/deploy-production.sh \
            "${SSH_USER}@${SSH_HOST}:/opt/alowalow/production/deploy-production.sh"
          "${scp_command[@]}" deploy/sync-test-otp-env.sh \
            "${SSH_USER}@${SSH_HOST}:/opt/alowalow/production/sync-test-otp-env.sh"
          "${scp_command[@]}" deploy/sync-receipt-agent-env.sh \
            "${SSH_USER}@${SSH_HOST}:/opt/alowalow/production/sync-receipt-agent-env.sh"
          "${scp_command[@]}" deploy/nginx/alowalow-http-temporary.conf \
            "${SSH_USER}@${SSH_HOST}:/opt/alowalow/production/alowalow-http-temporary.conf"
          "${scp_command[@]}" deploy/nginx/alowalow-production.conf \
            "${SSH_USER}@${SSH_HOST}:/opt/alowalow/production/alowalow-production.conf"
          "${scp_command[@]}" /tmp/alowalow-release.env \
            "${SSH_USER}@${SSH_HOST}:/opt/alowalow/production/.release.pending.env"
          if [ -s "$runtime_secret_file" ]; then
            "${scp_command[@]}" "$runtime_secret_file" \
              "${SSH_USER}@${SSH_HOST}:/opt/alowalow/production/.test-otp.pending.env"
            "${ssh_command[@]}" "${SSH_USER}@${SSH_HOST}" \
              'sh /opt/alowalow/production/sync-test-otp-env.sh'
          fi
          "${scp_command[@]}" "$receipt_agent_secret_file" \
            "${SSH_USER}@${SSH_HOST}:/opt/alowalow/production/.receipt-agent.pending.env"
          "${ssh_command[@]}" "${SSH_USER}@${SSH_HOST}" \
            'sh /opt/alowalow/production/sync-receipt-agent-env.sh'
          "${ssh_command[@]}" "${SSH_USER}@${SSH_HOST}" \
            'sh /opt/alowalow/production/deploy-production.sh'
          "${ssh_command[@]}" "${SSH_USER}@${SSH_HOST}" '
            set -eu
            sudo install -m 644 \
              /opt/alowalow/production/alowalow-http-temporary.conf \
              /etc/nginx/sites-available/a7-tagam-http-temporary.conf
            sudo install -m 644 \
              /opt/alowalow/production/alowalow-production.conf \
              /etc/nginx/sites-available/a7-tagam-production.conf
            test -e /etc/nginx/sites-enabled/a7-tagam-http-temporary.conf \
              || test -e /etc/nginx/sites-enabled/a7-tagam-production.conf
            sudo nginx -t
            sudo systemctl reload nginx
          '
