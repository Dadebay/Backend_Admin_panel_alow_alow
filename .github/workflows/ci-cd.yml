name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24.18.0

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: alowalow-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: api/package-lock.json
          package-manager-cache: true

      - name: Install API dependencies
        run: npm ci --prefix api --no-audit --no-fund

      - name: Start isolated test services
        run: |
          docker compose up -d --wait postgres redis minio
          docker compose run --rm minio-init

      - name: Lint API
        run: npm --prefix api run lint

      - name: Build API
        run: npm --prefix api run build

      - name: Test API with coverage
        run: npm --prefix api test

      - name: Audit all API dependencies
        run: npm --prefix api audit --audit-level=low

      - name: Audit production API dependencies
        run: npm --prefix api audit --omit=dev --audit-level=low

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-coverage-${{ github.run_id }}
          path: api/coverage
          if-no-files-found: warn
          retention-days: 14

      - name: Stop isolated test services
        if: always()
        run: docker compose down --volumes --remove-orphans

  frontend:
    name: Admin quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
          package-manager-cache: true

      - name: Install admin dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint admin
        run: npm run lint

      - name: Build and test admin
        run: npm test

      - name: Audit all admin dependencies
        run: npm audit --audit-level=low

      - name: Audit production admin dependencies
        run: npm audit --omit=dev --audit-level=low

      - name: Upload deployable admin build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alowalow-admin-${{ github.sha }}
          path: |
            dist
            .openai/hosting.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  api_contract:
    name: Swagger contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
          package-manager-cache: true

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix api --no-audit --no-fund

      - name: Regenerate Swagger TypeScript contract
        run: npm run api:client

      - name: Verify generated files are committed
        run: git diff --exit-code -- api/openapi.json app/lib/api-schema.ts

  container:
    name: Production containers
    needs:
      - backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build runtime image
        run: docker build --file api/Dockerfile --target runtime --tag alowalow-api:ci api

      - name: Build migration image
        run: docker build --file api/Dockerfile --target migration --tag alowalow-migration:ci api

      - name: Verify hardened runtime metadata
        run: |
          test "$(docker image inspect alowalow-api:ci --format '{{.Config.User}}')" = "node"
          test -n "$(docker image inspect alowalow-api:ci --format '{{json .Config.Healthcheck}}')"

      - name: Validate production Compose
        env:
          ALOWALOW_API_IMAGE: alowalow-api:ci
          ALOWALOW_MIGRATION_IMAGE: alowalow-migration:ci
          ALOWALOW_ENV_FILE: production.env.example
        run: docker compose --file deploy/compose.production.yml config --quiet

  publish_api:
    name: Publish API images
    needs:
      - backend
      - frontend
      - api_contract
      - container
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      api_image: ${{ steps.names.outputs.api_image }}
      migration_image: ${{ steps.names.outputs.migration_image }}
      api_digest: ${{ steps.publish.outputs.api_digest }}
      migration_digest: ${{ steps.publish.outputs.migration_digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Resolve immutable image names
        id: names
        shell: bash
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "api_image=${repository}-api" >> "$GITHUB_OUTPUT"
          echo "migration_image=${repository}-migration" >> "$GITHUB_OUTPUT"

      - name: Authenticate to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Initialize BuildKit
        run: |
          docker buildx create --name alowalow-builder --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Build and publish provenance-enabled images
        id: publish
        env:
          API_IMAGE: ${{ steps.names.outputs.api_image }}
          MIGRATION_IMAGE: ${{ steps.names.outputs.migration_image }}
        run: |
          docker buildx build \
            --file api/Dockerfile \
            --target runtime \
            --platform linux/amd64 \
            --provenance=mode=max \
            --sbom=true \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${API_IMAGE}:sha-${GITHUB_SHA}" \
            --tag "${API_IMAGE}:latest" \
            --metadata-file /tmp/api-metadata.json \
            --push \
            api
          docker buildx build \
            --file api/Dockerfile \
            --target migration \
            --platform linux/amd64 \
            --provenance=mode=max \
            --sbom=true \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${MIGRATION_IMAGE}:sha-${GITHUB_SHA}" \
            --tag "${MIGRATION_IMAGE}:latest" \
            --metadata-file /tmp/migration-metadata.json \
            --push \
            api
          echo "api_digest=$(jq -r '."containerimage.digest"' /tmp/api-metadata.json)" >> "$GITHUB_OUTPUT"
          echo "migration_digest=$(jq -r '."containerimage.digest"' /tmp/migration-metadata.json)" >> "$GITHUB_OUTPUT"

      - name: Log out of registry
        if: always()
        run: docker logout ghcr.io

  deploy_production:
    name: Deploy production API
    needs:
      - publish_api
    if: >-
      needs.publish_api.result == 'success'
      && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure verified SSH access
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Prepare immutable release references
        env:
          API_IMAGE: ${{ needs.publish_api.outputs.api_image }}
          API_DIGEST: ${{ needs.publish_api.outputs.api_digest }}
          MIGRATION_IMAGE: ${{ needs.publish_api.outputs.migration_image }}
          MIGRATION_DIGEST: ${{ needs.publish_api.outputs.migration_digest }}
        run: |
          printf 'ALOWALOW_API_IMAGE=%s@%s\n' "$API_IMAGE" "$API_DIGEST" > /tmp/alowalow-release.env
          printf 'ALOWALOW_MIGRATION_IMAGE=%s@%s\n' "$MIGRATION_IMAGE" "$MIGRATION_DIGEST" >> /tmp/alowalow-release.env

      - name: Deploy after successful migration
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          ssh "${SSH_USER}@${SSH_HOST}" 'mkdir -p ~/alowalow'
          scp deploy/compose.production.yml "${SSH_USER}@${SSH_HOST}:alowalow/docker-compose.production.yml"
          scp deploy/deploy-production.sh "${SSH_USER}@${SSH_HOST}:alowalow/deploy-production.sh"
          scp /tmp/alowalow-release.env "${SSH_USER}@${SSH_HOST}:alowalow/.release.next.env"
          ssh "${SSH_USER}@${SSH_HOST}" 'sh ~/alowalow/deploy-production.sh'
