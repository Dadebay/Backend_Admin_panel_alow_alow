# AlowAlow DEV only. This file intentionally does not bind ports 80 or 443.
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name 216.250.11.77;

    ssl_certificate /etc/letsencrypt/live/216.250.11.77/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/216.250.11.77/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AlowAlowTLS:10m;
    ssl_session_timeout 10m;

    client_max_body_size 6m;

    # HSTS is intentionally omitted: this is a shared IP and another project
    # owns its standard HTTP/HTTPS virtual hosts.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/v1/ {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
    }

    location = /docs {
        proxy_pass http://127.0.0.1:4001/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /docs-json {
        proxy_pass http://127.0.0.1:4001/docs-json;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
    }
}
