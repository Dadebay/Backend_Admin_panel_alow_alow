# Temporary HTTP-only bootstrap for the first IP certificate. Remove this site
# after Certbot succeeds and before enabling alowalow-development.conf.
server {
    listen 80;
    listen [::]:80;
    server_name 216.250.12.132;

    include /etc/nginx/snippets/alowalow-acme-location.conf;

    location / {
        return 404;
    }
}
