services:
  postgres:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    env_file:
      - ${ALOWALOW_ENV_FILE:-.env.development}
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=30
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 192m
    mem_reservation: 96m
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:8.8.0-alpine@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
    env_file:
      - ${ALOWALOW_ENV_FILE:-.env.development}
    command:
      - /bin/sh
      - -ec
      - >-
        exec redis-server
        --port 0
        --tls-port 6379
        --tls-cert-file /tls/redis.crt
        --tls-key-file /tls/redis.key
        --tls-ca-cert-file /tls/ca.crt
        --tls-auth-clients no
        --requirepass "$${REDIS_PASSWORD}"
        --save ""
        --appendonly no
        --maxmemory 64mb
        --maxmemory-policy volatile-ttl
    restart: unless-stopped
    volumes:
      - ./redis-tls:/tls:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli --tls --cacert /tls/ca.crt ping | grep -qx PONG",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 96m
    mem_reservation: 48m
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  minio:
    image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    env_file:
      - ${ALOWALOW_ENV_FILE:-.env.development}
    command: server /data
    restart: unless-stopped
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 192m
    mem_reservation: 96m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  minio-init:
    image: minio/mc:latest@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    env_file:
      - ${ALOWALOW_ENV_FILE:-.env.development}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - >-
        mc alias set local http://minio:9000
        "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${S3_BUCKET}"
    restart: "no"
    mem_limit: 64m
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  migrate:
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 384m
    mem_reservation: 128m

  api:
    environment:
      NODE_EXTRA_CA_CERTS: /run/alowalow/redis-ca.crt
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./redis-tls/ca.crt:/run/alowalow/redis-ca.crt:ro
    mem_limit: 384m
    mem_reservation: 192m

  admin:
    mem_limit: 256m
    mem_reservation: 128m

volumes:
  postgres_data:
  minio_data:
