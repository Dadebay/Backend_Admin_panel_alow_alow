services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: alofood
      POSTGRES_USER: alofood
      POSTGRES_PASSWORD: alofood
    ports:
      - "5432:5432"
    volumes:
      - alofood_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alofood -d alofood"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: alofood
      MINIO_ROOT_PASSWORD: alofood-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - alofood_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 alofood alofood-local-secret &&
        mc mb --ignore-existing local/alo-food-media

volumes:
  alofood_postgres:
  alofood_minio:
