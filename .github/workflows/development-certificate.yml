name: Renew development IP certificate

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

concurrency:
  group: development-ip-certificate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renew:
    name: Renew and install certificate
    if: >-
      github.event_name == 'workflow_dispatch'
      || vars.DEVELOPMENT_CERTIFICATE_RENEWAL_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: development
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install pinned Certbot
        run: python -m pip install --disable-pip-version-check 'certbot==5.7.0'

      - name: Configure verified SSH access
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY || secrets.DEVELOPMENT_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS || secrets.DEVELOPMENT_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Download current ACME state
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST || secrets.DEVELOPMENT_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER || secrets.DEVELOPMENT_SSH_USER }}
        run: |
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          install -d -m 700 /tmp/a7-acme-state
          rsync -az \
            "${SSH_USER}@${SSH_HOST}:/opt/alowalow/acme-state/" \
            /tmp/a7-acme-state/
          test -s /tmp/a7-acme-state/renewal/216.250.12.132.conf

      - name: Renew when due
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST || secrets.DEVELOPMENT_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER || secrets.DEVELOPMENT_SSH_USER }}
          DEPLOY_SSH_KEY_FILE: /home/runner/.ssh/id_ed25519
        run: |
          certbot renew \
            --config-dir /tmp/a7-acme-state \
            --work-dir /tmp/a7-acme-work \
            --logs-dir /tmp/a7-acme-logs \
            --manual-auth-hook "$GITHUB_WORKSPACE/deploy/certbot-remote-auth.sh" \
            --manual-cleanup-hook "$GITHUB_WORKSPACE/deploy/certbot-remote-cleanup.sh" \
            --no-random-sleep-on-renew \
            --non-interactive

      - name: Install state and reload Nginx
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST || secrets.DEVELOPMENT_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER || secrets.DEVELOPMENT_SSH_USER }}
        run: |
          ssh "${SSH_USER}@${SSH_HOST}" \
            'install -d -m 700 /tmp/a7-acme-state-pending'
          rsync -az --delete \
            /tmp/a7-acme-state/ \
            "${SSH_USER}@${SSH_HOST}:/tmp/a7-acme-state-pending/"
          ssh "${SSH_USER}@${SSH_HOST}" '
            set -eu
            sudo install -d -m 700 -o ubuntu -g ubuntu /opt/alowalow/acme-state
            sudo rsync -a --delete /tmp/a7-acme-state-pending/ /opt/alowalow/acme-state/
            sudo chown -R ubuntu:ubuntu /opt/alowalow/acme-state
            sudo chmod 700 /opt/alowalow/acme-state
            sudo nginx -t
            sudo systemctl reload nginx
            sudo find /tmp/a7-acme-state-pending -depth -delete
          '
