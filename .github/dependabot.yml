version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Ashgabat
    open-pull-requests-limit: 5
    groups:
      admin-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /api
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Asia/Ashgabat
    open-pull-requests-limit: 5
    groups:
      api-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Asia/Ashgabat
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Asia/Ashgabat
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Ashgabat
    open-pull-requests-limit: 5
